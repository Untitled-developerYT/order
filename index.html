<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HTML Link Runner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #fff;
    }
    /* Generator UI (hidden when rendering a link) */
    #builder {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    textarea, input {
      width: 100%;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      margin-bottom: 12px;
    }
    button {
      background: #007aff; /* iOS Blue */
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:active { opacity: 0.8; }
    /* Fullscreen viewport for rendered HTML */
    #viewer {
      width: 100vw;
      min-height: 100vh;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Link Generator Mode -->
  <div id="builder">
    <h2>HTML to Base64 Link Generator</h2>
    <textarea id="htmlInput" rows="8" placeholder="Paste your HTML code here..."></textarea>
    <button onclick="generateLink()">Generate & Copy Link</button>
    <p id="status" style="color: #4cd964; font-size: 14px;"></p>
    <input type="text" id="outputUrl" readonly placeholder="Your generated link will appear here...">
  </div>

  <!-- Render Mode -->
  <div id="viewer"></div>

  <script>
    // UTF-8 safe Base64 Encode (Prevents crashes with emojis/symbols on iOS)
    function encodeBase64(str) {
      const bytes = new TextEncoder().encode(str);
      const binString = Array.from(bytes, (byte) => String.fromCodePoint(byte)).join("");
      return btoa(binString);
    }

    // UTF-8 safe Base64 Decode (Handles URL-safe '-' and '_' characters)
    function decodeBase64(base64) {
      const normalized = base64.replace(/-/g, '+').replace(/_/g, '/');
      const binString = atob(normalized);
      const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
      return new TextDecoder().decode(bytes);
    }

    // Generate the shareable URL
    function generateLink() {
      const rawHtml = document.getElementById('htmlInput').value.trim();
      if (!rawHtml) return;

      const encoded = encodeBase64(rawHtml);
      const baseUrl = window.location.origin + window.location.pathname;
      const finalUrl = `${baseUrl}?v=${encodeURIComponent(encoded)}`;

      const outputBox = document.getElementById('outputUrl');
      outputBox.value = finalUrl;
      outputBox.select();
      
      // Copy to clipboard (with fallback for older iOS Safari versions)
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(finalUrl);
      } else {
        document.execCommand('copy');
      }
      document.getElementById('status').textContent = "Link generated and copied to clipboard!";
    }

    // Check URL on load for ?v= parameter
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const payload = params.get('v');

      if (payload) {
        document.getElementById('builder').style.display = 'none';
        const viewer = document.getElementById('viewer');
        viewer.style.display = 'block';

        try {
          // Support both Base64 and raw URL-encoded HTML
          let decodedHtml = "";
          if (payload.trim().startsWith('<')) {
            decodedHtml = payload;
          } else {
            decodedHtml = decodeBase64(payload);
          }

          viewer.innerHTML = decodedHtml;

          // iOS Safari Fixes:
          // 1. Force inline video playback so iOS doesn't hijack fullscreen
          viewer.querySelectorAll('video').forEach(video => {
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
          });

          // 2. Re-execute any <script> tags injected via innerHTML
          viewer.querySelectorAll('script').forEach(oldScript => {
            const newScript = document.createElement('script');
            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
            oldScript.parentNode.replaceChild(newScript, oldScript);
          });

        } catch (err) {
          viewer.innerHTML = `<p style="padding:20px; color:#ff3b30;">Invalid HTML or Base64 link format.</p>`;
        }
      }
    });
  </script>
</body>
</html>
